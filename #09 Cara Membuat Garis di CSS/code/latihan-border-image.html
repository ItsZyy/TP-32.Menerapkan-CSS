<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        blockquote {
            margin: 1em;
            padding: 1em;
            font-size: 2em;
            border-width: 1em;
            border-style: solid;
            border-image: url(border.svg) 100 round;
        }
    </style>
</head>
<body>
    <blockquote>
        Hello ini adalah contoh latihan membuat garis di CSS dengan border image.
        Perhatikan elemen blockquote di atas 👆, kita memberikan garis dengan gambar
        sebagai border-nya.
    </blockquote>
</body>
</html>
